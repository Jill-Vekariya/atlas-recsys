[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-recsys"
version = "0.1.0"
description = "Reproducible cold-start recommendation experiments and serving"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.4", "pandas==3.0.6", "scipy==1.18.1",
  "scikit-learn==1.7.2", "pyarrow==25.0.1", "duckdb==1.5.6",
  "torch==2.14.1", "faiss-cpu==1.15.1", "implicit==0.7.3",
  "lightgbm==4.7.0", "fastapi==0.143.0", "uvicorn==0.54.0",
  "httpx==0.28.1", "prometheus-client==0.26.0", "PyYAML==6.0.3",
  "mlflow-skinny==3.17.1", "streamlit==1.65.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
