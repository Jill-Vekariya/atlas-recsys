name: container-image
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.23
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: cloud
          load: true
          tags: atlas:release-test
      - name: Smoke-test container before publication
        run: |
          docker run -d --name atlas-release -p 127.0.0.1:10000:10000 -e ATLAS_API_KEY=release-check -e ATLAS_EPHEMERAL=true atlas:release-test
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:10000/api/ready && curl --fail --silent http://127.0.0.1:10000/_stcore/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:10000/_stcore/health
          docker exec atlas-release python scripts/verify_deployment.py
          docker rm -f atlas-release
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          target: cloud
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Record published image
        env:
          ATLAS_IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          ATLAS_IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          ATLAS_SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              "tags": os.environ["ATLAS_IMAGE_TAGS"].splitlines(),
              "digest": os.environ["ATLAS_IMAGE_DIGEST"],
              "source_commit": os.environ["ATLAS_SOURCE_SHA"],
          }
          Path("image-manifest.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: published-image-manifest
          path: image-manifest.json
