name: container-image
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.23
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: cloud
          load: true
          tags: atlas:release-test
      - name: Smoke-test container before publication
        run: |
          docker run -d --name atlas-release -p 127.0.0.1:10000:10000 atlas:release-test
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:10000/api/ready; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:10000/_stcore/health
          docker rm -f atlas-release
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: cloud
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
